name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    name: Test & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Install Compact compiler
        run: |
          curl -proto '=https' --tlsv1.2 -sSf https://docs.midnight.network/install.sh | bash || true
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Compact compile
        run: |
          if command -v compact &> /dev/null; then
            npm run compile
          else
            echo "Compact compiler not in path, using managed/ circuit bindings"
          fi

      - name: Run test suite
        run: npm test

      - name: Build frontend dApp bundle
        run: npm run build
